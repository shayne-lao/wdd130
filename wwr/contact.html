<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evalia Whitewater Rafting | Contact</title>
    <meta name="description" content="Ways to reach out to Evalia Whitewater Rafting company">
    <meta name="author" content="Shayne Gabrielle G. Lao">
    <link rel="stylesheet" href="styles/contact.css">
</head>
<body>
    <header>
        <nav>
            <img src="images/logo.png" alt="Whitewater Rafting Logo">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div>
            <h1>White Water Rafting Company</h1>
            <h2>128 Freefall Street</h2>
            <h2>Lucella, Evalia</h2>
            <h2>+1 443 253 5246</h2>
            <h2>evaliahq@whitewater.com</h2>
        </div>
        <div class="container">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d28687.904853300595!2d8.97670853495746!3d61.76631086379528!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1795673697236!5m2!1sen!2sph" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <div class="form">
                    <div class="narrow">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Jane Doe" required>
                    </div>
                    <div class="narrow">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="janedoe@gmail.com" required>
                    </div>
                    <div class="checkbox-row2">
                        <label for="message_purpose">Message Purpose</label>
                        <input type="checkbox" id="general" name="general">
                        <label for="general">General Inquiry</label>
                        <input type="checkbox" id="reservation" name="reservation">
                        <label for="reservation">Reservation Question</label>
                        <input type="checkbox" id="webs_suggestion" name="webs_suggestion">
                        <label for="webs_suggestion">Website Suggestion</label>
                    </div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="3" placeholder="Type here"></textarea>
                    <div class="checkbox-row">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </div>
        <section class="box-img">
            <h2>We Are Here to Serve You!</h2>
            <figure>
                <img src="images/employee_1.jpg" alt="River Operations Manager" width="150">
                <figcaption>
                    Anaya Pearce -- River Operations Manager
                </figcaption>
            </figure>
            <figure>
                <img src="images/employee_2.jpg" alt="Lead River Guide" width="150">
                <figcaption>
                    Cassandra Solomon -- Lead River Guide
                </figcaption>
            </figure>
            <figure>
                <img src="images/employee_3.jpg" alt="Safety Kayaker" width="150">
                <figcaption>
                    Eden Henry -- Safety Kayaker
                </figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&#169; 2026 | Evalia Water Rafting | Shayne Lao</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
            <img src="images/facebook1.jpg" alt="Facebook" width="50">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram.png" alt="Instagram" width="50">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin.png" alt="LinkedIn" width="50">
            </a>
        </nav> 
    </footer>
</body>
</html>
